# Initial single-device smoke configuration; requires task-matched weights/stats.
defaults:
- env/robodojo_stack_bowls@env.eval
- model/xpolicylab@rollout.model
- override hydra/job_logging: stdout
- _self_
hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
  - file://${oc.env:RLINF_PATH}/examples/embodiment/config
cluster:
  num_nodes: 1
  component_placement:
    env, rollout: '0'
runner:
  task_type: embodied_eval
  logger:
    log_path: ${oc.env:RLINF_PATH}/../results
    project_name: robodojo_rlinf
    experiment_name: robodojo_stack_bowls_xpolicylab_abot_eval
    logger_backends:
    - tensorboard
  max_epochs: 1000
  max_steps: -1
  only_eval: true
  val_check_interval: -1
  save_interval: -1
  resume_dir: null
  ckpt_path: null
env:
  group_name: EnvGroup
  enable_offload: false
  eval:
    is_eval: true
    use_fixed_reset_state_ids: true
    init_params:
      layout_seed: 1
    enable_shaping: false
    shaping_weight: 0.0
rollout:
  group_name: RolloutGroup
  backend: huggingface
  recompute_logprobs: false
  enable_offload: false
  pipeline_stage_num: 1
  model:
    model_path: ${oc.env:POLICY_MODEL_PATH}
    num_action_chunks: 50
    action_dim: 14
    xpolicylab:
      policy_name: Abot_M0
      required_mode: eval
      rl:
        modes:
        - eval
        - grpo
      checkpoint_num: 50000
      unnorm_key: robodojo_sim
      env_cfg_type: arx_x5
      action_type: joint
      task_name: stack_bowls
