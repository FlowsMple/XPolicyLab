defaults:
  - env/robodojo_stack_bowls@env.train
  - env/robodojo_stack_bowls@env.eval
  - model/xpolicylab@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - recipe/openwam_nft@_global_
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:RLINF_PATH}/examples/embodiment/config

runner:
  logger:
    experiment_name: robodojo_stack_bowls_openwam_nft

actor:
  model:
    xpolicylab:
      openwam_benchmark: robodojo
      env_cfg_type: ${env.train.init_params.env_cfg_type}

env:
  group_name: EnvGroup
  enable_offload: false
  train:
    action_type: ee
    total_num_envs: 2
    group_size: ${algorithm.group_size}
    max_episode_steps: 16
    max_steps_per_rollout_epoch: ${env.train.max_episode_steps}
  eval:
    action_type: ee
    is_eval: true
    use_fixed_reset_state_ids: true
    init_params:
      layout_seed: 1
