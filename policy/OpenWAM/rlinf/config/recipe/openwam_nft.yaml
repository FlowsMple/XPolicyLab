cluster:
  num_nodes: 1
  # One L20 cannot hold the actor backward and the rollout copy together.
  # Actor stays on GPU 0. Env and rollout share GPU 1, one rank each.
  component_placement:
    actor: 0
    env, rollout: 1

runner:
  task_type: embodied
  logger:
    log_path: ${oc.env:RLINF_PATH}/../results
    project_name: rlinf
    logger_backends: ["tensorboard"] # wandb, swanlab

  max_epochs: 2
  max_steps: -1

  only_eval: False
  val_check_interval: -1
  save_interval: 1

  resume_dir: null
  ckpt_path: null

algorithm:
  normalize_advantages: False
  kl_penalty: kl
  group_size: 2
  reward_coef: 1.0

  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: token_level

  update_epoch: 1
  adv_type: grpo
  loss_type: embodied_nft
  loss_agg_func: "token-mean"
  nft_xcur_source: rollout
  nft_target_space: x0
  nft_tau: 1.0
  nft_loss_form: mse
  nft_beta: 0.1
  adv_clip_max: 5.0
  nft_clip_ratio: 0.1
  recompute_v: False
  kl_beta: 0.0
  entropy_bonus: 0
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0

  gamma: 1.0
  gae_lambda: 0.95

  filter_rewards: False
  rewards_lower_bound: 0.1
  rewards_upper_bound: 0.9

rollout:
  group_name: "RolloutGroup"
  backend: "huggingface"
  recompute_logprobs: False
  enable_offload: False
  pipeline_stage_num: 1
  model:
    model_path: ${actor.model.model_path}
    precision: ${actor.model.precision}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 1
  global_batch_size: 2
  seed: 1234
  enable_offload: False

  model:
    model_path: ${oc.env:POLICY_MODEL_PATH}
    precision: bf16
    num_action_chunks: 1
    action_dim: 16
    add_value_head: False
    xpolicylab:
      policy_name: OpenWAM
      required_mode: nft
      experimental_nft: true
      action_type: ee
      seed: 42
      device: cuda
      replan_steps: 1

  optim:
    lr: 1.0e-06
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 0.0
    clip_grad: 1.0

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: no_shard
    use_orig_params: True
    gradient_checkpointing: True
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      # Frozen video weights are buffers. A buffer dtype makes FSDP clone
      # them on GPU while building the rollout state dict.
      buffer_dtype: null

reward:
  use_reward_model: False

critic:
  use_critic_model: False
