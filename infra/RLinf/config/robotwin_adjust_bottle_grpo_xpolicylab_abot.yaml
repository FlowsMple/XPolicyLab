defaults:
  - env/robotwin_adjust_bottle@env.train
  - env/robotwin_adjust_bottle@env.eval
  - model/xpolicylab@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:RLINF_PATH}/examples/embodiment/config

cluster:
  num_nodes: 1
  component_placement:
    actor, env, rollout: 0-7

runner:
  task_type: embodied
  logger:
    log_path: ${oc.env:RLINF_PATH}/../results
    project_name: rlinf
    experiment_name: "robotwin_grpo_xpolicylab_abot"
    logger_backends: ["tensorboard"] # wandb, swanlab

  max_epochs: 1000
  max_steps: -1

  only_eval: False
  val_check_interval: 10
  save_interval: 10

  resume_dir: null
  ckpt_path: null

algorithm:
  normalize_advantages: True
  kl_penalty: kl
  group_size: 4
  reward_coef: 1.0

  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: token_level

  # chunk_level log-probs sum 50x14 dims, so keep one pass per rollout (as in the native ABot recipe).
  update_epoch: 1
  adv_type: grpo
  loss_type: actor
  loss_agg_func: "token-mean"
  kl_beta: 0.0
  entropy_bonus: 0
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0

  gamma: 0.99
  gae_lambda: 0.95

  filter_rewards: True
  rewards_lower_bound: 0.1
  rewards_upper_bound: 0.9

env:
  group_name: "EnvGroup"
  enable_offload: True
  train:
    rollout_epoch: 4
    # Ray-traced cameras take 3-4.5 GB per env. Train scenes stay resident (rebuilding them
    # costs ~100 s per step), so train + eval + policy must fit one 44 GB card together.
    total_num_envs: 32
    reward_coef: ${algorithm.reward_coef}
    group_size: ${algorithm.group_size}
    assets_path: ${oc.env:ROBOTWIN_ASSETS_PATH}
    seeds_path: ${oc.env:RLINF_PATH}/rlinf/envs/sim/robotwin/seeds/train_seeds.json
    center_crop: False
    video_cfg:
      save_video: False
    task_config:
      # Sim memory grows ~0.3 GB per step; restarting the sim server every 40 full resets
      # (10 steps x 4 rollout epochs) caps it. Only read when ROBOTWIN_SIM_PYTHON is set.
      sim_restart_resets: 40
      embodiment: [aloha-agilex]
      camera:
        collect_wrist_camera: true
      domain_randomization:
        random_background: false
        cluttered_table: false
        clean_background_rate: 1
        random_head_camera_dis: 0
        random_table_height: 0
        random_light: false
        crazy_random_light_rate: 0
  eval:
    rollout_epoch: 1
    total_num_envs: 16
    # Offloading stops the eval sim server, which returns its GPU memory between evals.
    enable_offload: True
    auto_reset: True
    ignore_terminations: True
    reward_coef: ${algorithm.reward_coef}
    group_size: 1
    use_fixed_reset_state_ids: True
    is_eval: True
    assets_path: ${oc.env:ROBOTWIN_ASSETS_PATH}
    seeds_path: ${oc.env:RLINF_PATH}/rlinf/envs/sim/robotwin/seeds/eval_seeds.json
    video_cfg:
      save_video: True
      video_base_dir: ${runner.logger.log_path}/video/eval
    center_crop: False
    task_config:
      embodiment: [aloha-agilex]
      camera:
        collect_wrist_camera: true
      domain_randomization:
        random_background: false
        cluttered_table: false
        clean_background_rate: 1
        random_head_camera_dis: 0
        random_table_height: 0
        random_light: false
        crazy_random_light_rate: 0

rollout:
  group_name: "RolloutGroup"
  backend: "huggingface"
  recompute_logprobs: False
  enable_offload: True
  pipeline_stage_num: 1
  model:
    model_path: ${actor.model.model_path}
    precision: ${actor.model.precision}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 8
  global_batch_size: 128
  seed: 1234
  enable_offload: True

  model:
    # ABot-M0 run dir (checkpoints/steps_<N>_pytorch_model.pt + dataset_statistics.json).
    model_path: ${oc.env:POLICY_MODEL_PATH}
    num_action_chunks: 50
    action_dim: 14
    add_value_head: False
    xpolicylab:
      policy_name: Abot_M0
      required_mode: grpo
      checkpoint_num: 50000
      unnorm_key: robodojo_sim
      env_cfg_type: aloha_agilex
      action_type: joint
      rl_head:
        noise_level: 0.5

  optim:
    lr: 5.0e-06
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 0.01
    clip_grad: 1.0

  fsdp_config:
    strategy: "fsdp"
    gradient_checkpointing: False
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
