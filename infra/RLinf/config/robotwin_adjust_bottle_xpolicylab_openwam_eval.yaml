defaults:
  - env/robotwin_adjust_bottle@env.eval
  - model/xpolicylab@rollout.model
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:RLINF_PATH}/examples/embodiment/config

cluster:
  num_nodes: 1
  component_placement:
    env, rollout: 0

runner:
  task_type: embodied_eval
  logger:
    log_path: ${oc.env:RLINF_PATH}/../results
    project_name: rlinf
    experiment_name: "robotwin_openwam_eval"
    logger_backends: ["tensorboard"] # wandb, swanlab

  max_epochs: 1000
  max_steps: -1

  only_eval: True
  val_check_interval: -1
  save_interval: -1

  resume_dir: null
  ckpt_path: null  # Optional: .pt checkpoint loaded after the model is built (e.g. an RL actor checkpoint).

env:
  group_name: "EnvGroup"
  enable_offload: False
  eval:
    rollout_epoch: 1
    total_num_envs: 2
    auto_reset: True
    ignore_terminations: True
    native_quaternion_order: ${oc.env:ROBOTWIN_QUATERNION_ORDER}
    reward_coef: 1.0
    group_size: 1
    use_fixed_reset_state_ids: True
    is_eval: True
    assets_path: ${oc.env:ROBOTWIN_ASSETS_PATH}
    seeds_path: ${oc.env:RLINF_PATH}/rlinf/envs/sim/robotwin/seeds/eval_seeds.json
    video_cfg:
      save_video: True
      video_base_dir: ${runner.logger.log_path}/video/eval
    center_crop: False
    task_config:
      data_type:
        endpose: true
      embodiment: [aloha-agilex]
      camera:
        collect_wrist_camera: true
      domain_randomization:
        random_background: false
        cluttered_table: false
        clean_background_rate: 1
        random_head_camera_dis: 0
        random_table_height: 0
        random_light: false
        crazy_random_light_rate: 0

rollout:
  group_name: "RolloutGroup"
  backend: "huggingface"
  recompute_logprobs: False
  enable_offload: False
  pipeline_stage_num: 1
  model:
    model_path: ${oc.env:POLICY_MODEL_PATH}
    precision: bf16
    num_action_chunks: 1
    action_dim: 16
    xpolicylab:
      policy_name: OpenWAM
      required_mode: eval
      openwam_benchmark: robotwin
      env_cfg_type: aloha_agilex
      action_type: ee
      device: cuda
      seed: 42
      replan_steps: 1
